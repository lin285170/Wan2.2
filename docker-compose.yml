# Wan2.2 Master Node: Redis + API + Worker0 (4×A100 40GB).
#
# Each node runs its own torchrun locally; NCCL rendezvous connects them.
# No SSH needed — master signals worker1 via Redis pub/sub.
#
# Prerequisites: NVIDIA Container Toolkit; Docker Compose v2.
#
# Usage:
#   cp docker/compose.env.example .env
#   # edit .env (WAN_SERVE_API_KEYS, WAN_CKPT_HOST_PATH, WAN_MASTER_ADDR)
#
#   docker compose up -d --build
#
# On the secondary server, use docker-compose.worker.yml:
#   docker compose -f docker-compose.worker.yml up -d --build
#
# Logs:  docker compose logs -f api
#        docker compose logs -f worker0

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - wan_redis:/data
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "${WAN_API_PORT:-8008}:8008"
    environment:
      WAN_REDIS_URL: redis://redis:6379/0
      WAN_SERVE_API_KEYS: ${WAN_SERVE_API_KEYS:?set WAN_SERVE_API_KEYS in .env}
      WAN_REPO_ROOT: /app
      WAN_CKPT_DIR: /ckpt
      WAN_JOB_DIR: /data/jobs
      WAN_OUTPUT_DIR: /data/outputs
      WAN_API_HOST: 0.0.0.0
      WAN_API_PORT: "8008"
    volumes:
      - wan_shared:/data
    depends_on:
      - redis

  worker0:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      WAN_REDIS_URL: redis://redis:6379/0
      WAN_SERVE_API_KEYS: ${WAN_SERVE_API_KEYS}
      WAN_REPO_ROOT: /app
      WAN_CKPT_DIR: /ckpt
      WAN_JOB_DIR: /data/jobs
      WAN_OUTPUT_DIR: /data/outputs
      WAN_NODE_ROLE: master
      WAN_NNODES: ${WAN_NNODES:-2}
      WAN_NPROC_PER_NODE: ${WAN_NPROC_PER_NODE:-4}
      WAN_NODE_RANK: 0
      WAN_MASTER_ADDR: ${WAN_MASTER_ADDR:-0.0.0.0}
      WAN_MASTER_PORT: ${WAN_MASTER_PORT:-29500}
      WAN_RDZV_PREFIX: ${WAN_RDZV_PREFIX:-wan}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - wan_shared:/data
      - ${WAN_CKPT_HOST_PATH:-./.wan_ckpt_placeholder}:/ckpt:ro
    depends_on:
      - redis

volumes:
  wan_redis:
  wan_shared: